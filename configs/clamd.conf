# ==============================================================================
# CLAMAV DAEMON CONFIGURATION (clamd.conf)
# ==============================================================================

# Socket configuration
LocalSocket /var/run/clamav/clamd.ctl
LocalSocketMode 666
FixStaleSocket yes

# Process & User
User clamav
Foreground yes
LogTime yes
LogClean no
LogVerbose no
LogSyslog no
LogFacility LOG_LOCAL6
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 10M

# Database
DatabaseDirectory /var/lib/clamav

# Scanning Limits & Engine Tuning
MaxScanSize 100M
MaxFileSize 100M
MaxRecursion 5
MaxFiles 1000
MaxEmbeddedPE 10M
MaxHTMLNormalize 10M
MaxScriptNormalize 5M

# Scan Features
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanArchive yes

# Heuristics & Alerts
AlertBrokenExecutables yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes

# Bytecode Engine
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeTimeout 5000

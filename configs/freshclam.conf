# ==============================================================================
# FRESHCLAM UPDATER CONFIGURATION (freshclam.conf)
# ==============================================================================

# Database directory
DatabaseDirectory /var/lib/clamav

# Log configuration
UpdateLogFile /var/log/clamav/freshclam.log
LogTime yes
LogVerbose no
LogSyslog no
LogFileMaxSize 10M

# Mirrors
DatabaseMirror database.clamav.net

# Checks per day (12 = check every 2 hours)
Checks 12

# Notify clamd after update
NotifyClamd /etc/clamav/clamd.conf
Foreground yes

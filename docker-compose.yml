services:
  clamav-service:
    image: vickyfatrian/vqf-clamav-service:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clamav-service
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-${PORT:-8080}}:${PORT:-8080}"
    env_file:
      - .env
    volumes:
      # Persistent volume for SQLite DB & Quarantine Vault
      - ./data:/data
      # Named volume to persist downloaded virus signatures across restarts
      - clamav_signatures:/var/lib/clamav
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        reservations:
          memory: 1536M
        limits:
          memory: 3072M

volumes:
  clamav_signatures:
    name: clamav_signatures_data
